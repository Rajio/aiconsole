version: '3.8'

services:
  db:
    image: postgres:12
    container_name: aiconsole_db
    environment:
      POSTGRES_DB: aiconsole
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123321
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 